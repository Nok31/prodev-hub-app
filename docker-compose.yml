version: '3.8'
services:
  # Base de Datos PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: hub_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hub_prodev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Servidor Redis 7
  redis:
    image: redis:7-alpine
    container_name: hub_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Almacenamiento MinIO (S3 Local)
  minio:
    image: minio/minio:latest
    container_name: hub_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API de S3
      - "9001:9001"   # Consola Web de MinIO
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data: